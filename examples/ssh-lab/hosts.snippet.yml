# Paste under dsh-remote-ssh config in the web profile cordis.patch.yml
# (after examples/ssh-lab is up). Prefer ~/.ssh/config Host aliases — see README.

hosts:
  - id: linux-lab
    host: 127.0.0.1
    user: dshprobe
    port: 2222
    os: linux
    # Copy key into WSL (~/.ssh) with mode 600 — /mnt/c keys are 0777 and OpenSSH rejects them.
    identityFile: /home/rchua/.ssh/dsh-lab/id_ed25519
  - id: aix-stub
    host: 127.0.0.1
    user: dshprobe
    port: 2223
    os: aix
    identityFile: /home/rchua/.ssh/dsh-lab/id_ed25519

# Optional Mac (real machine — replace host / user):
